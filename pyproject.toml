[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "policy_lens_eval"
version = "0.1.0"
description = "A closed-loop LLM evaluation framework for multilingual policy alignment."
dependencies = [
    "chromadb",
    "sentence-transformers",
    "groq"
]

[tool.setuptools]
packages = ["policy_lens"]